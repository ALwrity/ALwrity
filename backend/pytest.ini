[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Fast, no-dep sanity checks (router registration, health endpoints)
    critical: Auth and core flow happy paths (PR-blocking gate)
    regression: Bug-specific regression coverage
    integration: Cross-service flows
    functional: End-to-end functional coverage over HTTP
    slow: Tests that take >2s even with mocks
    trio: Tests parametrised over the trio backend
    linkedin: Specific to the LinkedIn feature area
    story_writer: Specific to the Story Writer feature area
    blog_writer: Specific to the Blog Writer feature area
    benchmark: Performance benchmark — measures endpoint timing, reports slow routes
